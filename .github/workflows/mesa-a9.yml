name: A9 PowerVR Mesa userspace (Linux compile only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mesa-a9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesa:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OrchardLinux/mesa
          ref: 7df85604e5097fef98442796965e321e1cf2a0e7
          persist-credentials: false
          path: mesa
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-venv python3-dev pkg-config build-essential bison flex libdrm-dev libexpat1-dev libzstd-dev zlib1g-dev libelf-dev libudev-dev libwayland-dev wayland-protocols libxkbcommon-dev llvm-18-dev libclang-18-dev libclang-cpp18-dev libllvmspirvlib-18-dev spirv-tools libclc-18-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/mesa-env"
          "$RUNNER_TEMP/mesa-env/bin/pip" install 'meson>=1.4,<2' mako packaging pyyaml
          echo "$RUNNER_TEMP/mesa-env/bin" >> "$GITHUB_PATH"
      - name: Configure PowerVR Vulkan and Zink (headless first build)
        run: |
          mkdir -p out
          meson setup mesa/build mesa --prefix=/usr --buildtype=release -Dvulkan-drivers=imagination -Dgallium-drivers=zink,softpipe -Dplatforms=[] -Dglx=disabled -Dllvm=enabled -Degl=enabled -Dgbm=enabled -Dgallium-va=disabled -Dgallium-rusticl=false -Dvideo-codecs=[] -Dallow-fallback-for=libdrm
      - name: Compile and stage native Linux userspace driver
        run: |
          ninja -C mesa/build -j2
          DESTDIR="$PWD/out/stage" ninja -C mesa/build install
          find out/stage -type f | sort > out/files.txt
          test -s out/stage/usr/lib/aarch64-linux-gnu/libvulkan_powervr_mesa.so
          readelf -h out/stage/usr/lib/aarch64-linux-gnu/libvulkan_powervr_mesa.so | tee out/gpu-elf.txt
          grep -q AArch64 out/gpu-elf.txt
          test -s out/stage/usr/share/vulkan/icd.d/powervr_mesa_icd.aarch64.json
          git -C mesa rev-parse HEAD > out/source-commit.txt
          tar -czf out/mesa-a9-linux.tar.gz -C out/stage .
          rm -rf out/stage
          (cd out && sha256sum mesa-a9-linux.tar.gz > SHA256SUMS)
          echo 'Headless Linux/glibc compile only; Wayland/display integration and Android/Bionic HAL are separate; not tested on J72s.' > out/limitations.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a9-mesa-linux-build
          path: |
            out/
            mesa/build/meson-logs/meson-log.txt
          retention-days: 7
